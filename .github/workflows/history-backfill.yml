name: History backfill (one time)

# Pulls 2014-2026 season-level history and NFL draft picks for the prospect model.
# Run by hand only. Files already in data/history/ are skipped, so re-runs are cheap.
on:
  workflow_dispatch:
    inputs:
      max_calls:
        description: "Stop after this many API calls"
        required: false
        default: "90"

permissions:
  contents: write

concurrency:
  group: weekly-update
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Pull history
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: python -u history_backfill.py --max-calls "${{ inputs.max_calls || '90' }}" 2>&1 | tee data/history-backfill.log
      - name: Commit
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/history data/history-backfill.log || true
          if git diff --cached --quiet; then echo "Nothing new."; else git commit -m "History backfill" && git push; fi
