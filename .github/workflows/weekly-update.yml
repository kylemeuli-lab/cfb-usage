name: Weekly stats update

on:
  schedule:
    # GitHub cron is always UTC.
    # Sunday 08:00 UTC = 1:00 AM PT / 4:00 AM ET: first pull of Saturday's games.
    - cron: "0 8 * * 0"
    # Sunday 16:00 UTC = 9:00 AM PT / noon ET: re-pull the same week to catch late
    # West Coast/Hawaii games that weren't final yet, plus any stat corrections.
    - cron: "0 16 * * 0"
  workflow_dispatch:
    inputs:
      week:
        description: "Week number (leave blank to auto-detect the latest week)"
        required: false
      year:
        description: "Season year (leave blank for current season)"
        required: false
      season_type:
        description: "regular or postseason"
        required: false
        default: regular

permissions:
  contents: write

concurrency:
  group: weekly-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Fetch and process stats
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        shell: bash
        run: |
          set -o pipefail
          ARGS=""
          if [ -n "${{ inputs.week }}" ]; then ARGS="$ARGS --week ${{ inputs.week }} --season-type ${{ inputs.season_type || 'regular' }}"; fi
          if [ -n "${{ inputs.year }}" ]; then ARGS="$ARGS --year ${{ inputs.year }}"; fi
          mkdir -p data
          # Log is committed so it can be reviewed without opening Actions. The key is never printed.
          python -u fetch_cfb_stats.py $ARGS 2>&1 | tee data/last_run.log

      - name: Refresh prospect scores
        # 3 API calls: this season's player stats, team stats and PPA. Skipped on backfills of a past week.
        if: success() && inputs.week == ''
        continue-on-error: true
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: |
          YEAR="${{ inputs.year }}"; YEAR="${YEAR:-$(date -u +%Y)}"
          python -u history_backfill.py --first "$YEAR" --last "$YEAR" --refresh --kinds player-stats,team-stats,ppa --max-calls 3 2>&1 | tee -a data/last_run.log
          python -u prospect_model.py score 2>&1 | tee -a data/last_run.log

      - name: Commit updated data
        if: always()   # also saves data/last_run.log when the fetch step fails
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add week_stats.json data/
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "${{ job.status == 'success' && 'Weekly stats update' || 'Failed run log' }}"
            git push
          fi
