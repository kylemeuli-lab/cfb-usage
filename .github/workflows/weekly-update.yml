name: Weekly stats update

on:
  schedule:
    # Sundays 08:00 UTC = 4:00 AM EDT / 3:00 AM EST.
    # GitHub cron is always UTC; this stays safely after late West Coast games year-round.
    - cron: "0 8 * * 0"
  workflow_dispatch:
    inputs:
      week:
        description: "Week number (leave blank to auto-detect the latest week)"
        required: false
      year:
        description: "Season year (leave blank for current season)"
        required: false
      season_type:
        description: "regular or postseason"
        required: false
        default: regular

permissions:
  contents: write

concurrency:
  group: weekly-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Fetch and process stats
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        shell: bash
        run: |
          set -o pipefail
          ARGS=""
          if [ -n "${{ inputs.week }}" ]; then ARGS="$ARGS --week ${{ inputs.week }} --season-type ${{ inputs.season_type || 'regular' }}"; fi
          if [ -n "${{ inputs.year }}" ]; then ARGS="$ARGS --year ${{ inputs.year }}"; fi
          mkdir -p data
          # Log is committed so it can be reviewed without opening Actions. The key is never printed.
          python -u fetch_cfb_stats.py $ARGS 2>&1 | tee data/last_run.log

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add week_stats.json data/
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Weekly stats update"
            git push
          fi
